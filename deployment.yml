apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  selector:
    matchLabels:
      app: nginxapp
  replicas: 2 
  template:
    metadata:
      labels:
        app: nginxapp
    spec:
      containers:
      - name: nginxc
        image: nginx
        ports:
        - containerPort: 80
